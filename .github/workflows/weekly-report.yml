name: Weekly report (자동발송)

on:
  schedule:
    # 본 운영: 매주 금요일 08:30 KST = 목 23:30 UTC
    - cron: '30 23 * * 4'
    # 일회성 자동 발사 테스트: 2026-05-28 UTC 05:00 = KST 14:00
    - cron: '0 5 28 5 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          # 워크플로에서 별도 사용
          pip install python-dotenv

      - name: Run weekly pipeline (수집 + 필터 + HTML 리포트)
        shell: bash
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          G2B_API_KEY:      ${{ secrets.DATA_GO_KR_KEY }}
          EAIS_API_KEY:     ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          # data/, logs 디렉터리 보장 (gitignored 라 fresh runner 엔 없음)
          mkdir -p data/raw data/filtered data/cache data/logs
          # 실제 파이프라인 실행 (HTML 자동 오픈 비활성)
          python scripts/run_weekly.py --no-open

      - name: Locate + verify report (품질 검증)
        id: verify
        shell: bash
        run: |
          REPORT=$(ls -t data/daily_report_*.html 2>/dev/null | head -1)
          if [ -z "$REPORT" ]; then
            echo "::error::리포트 파일을 못 찾음 (data/daily_report_*.html)"
            exit 1
          fi
          SIZE=$(stat -c%s "$REPORT" 2>/dev/null || wc -c < "$REPORT")
          echo "리포트 경로: $REPORT"
          echo "크기: $SIZE bytes"

          # 최소 크기 검증 (placeholder 가 아니라 진짜 리포트)
          if [ "$SIZE" -lt 20000 ]; then
            echo "::error::리포트가 너무 작음(${SIZE}B). 정상 크기는 100KB+ 이상"
            exit 1
          fi

          # 핵심 섹션 포함 여부
          for kw in "나라장터" "DART" "식약처" "뉴스"; do
            if ! grep -q "$kw" "$REPORT"; then
              echo "::warning::리포트에 '$kw' 섹션이 안 보임"
            fi
          done

          # docs/ 로 복사 (Pages 갱신)
          mkdir -p docs
          cp "$REPORT" docs/index.html
          echo "→ docs/index.html 갱신 (${SIZE}B)"

          # 다음 step 용으로 환경변수 export
          echo "REPORT_PATH=$REPORT" >> $GITHUB_ENV
          echo "REPORT_SIZE=$SIZE"   >> $GITHUB_ENV
          echo "KST_DATE=$(TZ=Asia/Seoul date +'%Y-%m-%d %a')" >> $GITHUB_ENV

      - name: 첨부용 HTML 파일 준비 (날짜 포함 파일명)
        shell: bash
        run: |
          # docs/index.html 을 더 식별 가능한 이름으로 복사하여 첨부
          ATT_NAME="수주레이더_$(TZ=Asia/Seoul date +'%Y-%m-%d').html"
          cp docs/index.html "data/$ATT_NAME"
          echo "ATT_PATH=data/$ATT_NAME" >> $GITHUB_ENV
          echo "  첨부 파일: $ATT_NAME ($(stat -c%s "data/$ATT_NAME") bytes)"

      - name: Send email to recipients (본문 + 첨부 파일)
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "[수주레이더] ${{ env.KST_DATE }} 주간 리포트"
          to: ${{ secrets.REPORT_RECIPIENTS }}
          from: 수주레이더 봇 <${{ secrets.SMTP_USER }}>
          html_body: file://docs/index.html
          attachments: ${{ env.ATT_PATH }}

      - name: Commit & push docs (Pages 갱신)
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "auto: weekly report — $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')"
            git push
          fi
