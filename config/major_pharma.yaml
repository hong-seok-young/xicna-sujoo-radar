# 한국 주요 제약·바이오사 화이트리스트 — MFDS GMP 카드 필터용
#
# 기준: 2024년 매출 약 500억원 이상 (자이씨앤에이 시공 단가 450억+ 기준).
# 출처: 제약바이오협회 매출 순위, DART 공시, KOSPI/KOSDAQ 제약 시총 상위.
