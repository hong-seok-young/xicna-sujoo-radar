# ─────────────────────────────────────────
# 3. 금액·면적·층수 정규식
# ─────────────────────────────────────────
money_regex:
  - "\\d{2,5}\\s*억\\s*(원)?"
  - "\\d+(\\.\\d+)?\\s*조\\s*(원)?"
  - "\\d{1,3}(,\\d{3})*\\s*억"

area_regex:
  - "\\d+(,\\d{3})*\\s*만\\s*㎡"
  - "\\d+(,\\d{3})*\\s*㎡"
  - "\\d+(,\\d{3})*\\s*평"

floor_regex:
  - "지하\\s*\\d+\\s*층\\s*~?\\s*지상\\s*\\d+\\s*층"
  - "지상\\s*\\d+\\s*층"

# ─────────────────────────────────────────
# 4. 매칭 로직
# ─────────────────────────────────────────
match_logic:
  rules:
    - name: "action_target"
      requires: ["action", "target"]
    - name: "target_money"
      requires: ["target", "money"]
    - name: "target_area"
      requires: ["target", "area"]

