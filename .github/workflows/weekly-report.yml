name: 주간 리포트 (자동발송)

on:
  schedule:
    # 본 운영: 매주 금요일 06:40 KST = 목요일 21:40 UTC
    # 정시(:00)는 GitHub 예약 혼잡으로 지연이 큼(실측 +40~87분, 증가 추세) → :40분으로 회피 + 20분 앞당김.
    # 목표: 금 07:00 KST 안팎 도착 (예약 07:00인데 실제 08:30까지 밀리던 드리프트 보정, 2026-06-19 조정)
    # daily-collect(21:00 UTC)보다 40분 뒤 → 수집→병합 순서 유지.
    - cron: '40 21 * * 4'
    # 백업 슬롯 — GitHub 이 예약 이벤트를 통째로 드롭하는 경우 대비 (2026-08-28 실제 발생:
    # 목 21:40 UTC 이벤트가 아예 안 떠서 run 조차 없었고, run 이 없으니 실패 알림도 없었다).
    # 세 슬롯 중 먼저 발송에 성공한 것만 나가고, 나머지는 precheck 에서 자동으로 건너뛴다.
    - cron: '40 22 * * 4'   # 금 07:40 KST
    - cron: '40 0 * * 5'    # 금 09:40 KST (마지막 자동 시도 — 11:00 감시 전에 끝나야 함)
  workflow_dispatch:
    inputs:
      send_email:
        description: '영업팀에 메일까지 발송 (실패한 주차를 수동 재발사할 때 체크. 미체크 시 Pages 갱신만)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read   # ci_weekly_guard 가 이전 run 의 발송 여부를 조회

# 풀(캐시) 동시 쓰기 방지 — 일일 수집(daily-collect)과 같은 그룹으로 직렬화
concurrency:
  group: rss-pool
  cancel-in-progress: false

jobs:
  # 백업 슬롯이 여러 개라 '이미 오늘 발송됐으면 건너뛴다' 판정이 먼저 필요하다.
  # 수동 dispatch 는 항상 진행 (재발송 의도를 막지 않음).
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.guard.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_weekly_guard.py --mode guard

  generate-and-publish:
    needs: precheck
    # precheck 가 (API 장애 등으로) 실패해도 발송은 진행한다 — 중복보다 누락이 나쁘다.
    # 'skip=true' 라고 명시적으로 판정났을 때만 건너뛴다.
    if: ${{ !cancelled() && needs.precheck.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Restore data/cache (DART body, MFDS prev-snapshot)
        uses: actions/cache@v6
        with:
          path: data/cache
          key: data-cache-${{ github.run_number }}
          restore-keys: |
            data-cache-

      - name: Restore RSS pool cache (일일 수집 누적분 — 7일 병합용)
        uses: actions/cache@v6
        with:
          path: data/pool
          key: rss-pool-${{ github.run_number }}
          restore-keys: |
            rss-pool-

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install python-dotenv

      - name: Run weekly pipeline (수집 + 필터 + HTML 리포트)
        shell: bash
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          G2B_API_KEY:      ${{ secrets.DATA_GO_KR_KEY }}
          # 식약처(MFDS) 수집기는 EAIS_API_KEY 이름으로 공공데이터포털 키를 읽는다
          # (src/stage0_collect/mfds_gmp.py — "공공데이터포털 키 재사용").
          # 이걸 안 넘겨서 CI 에서는 MFDS 단계가 조용히 return → 리포트의
          # '3. 식약처 GMP' 섹션이 매주 0건이었다 (2026-07-31 발견).
          EAIS_API_KEY:     ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          mkdir -p data/raw data/filtered data/cache data/pool data/week data/logs
          # 주간 풀파이프라인. --merge-pool: 매일 누적된 RSS 풀(data/pool)을 7일 병합(중복제거)해
          # 리포트에 사용 → RSS 피드 롤오프 누락 방지. DART·G2B·MFDS 는 --days 7 일괄 수집.
          # 세움터(EAIS)는 영업팀 요청으로 제거됨(2026-06-02).
          #
          # --allow-partial: 외부 소스 한 곳(G2B·DART·MFDS API 일시장애/키만료 등)이 실패해도
          #   리포트가 생성됐으면 exit 0. 예전엔 소스 1개 실패 = 워크플로 전체 실패 =
          #   영업팀 발송 스킵이었다(2026-07-31 발사 실패 원인). 실패한 단계는
          #   data/logs/run_status.json 으로 넘어와 아래 '부분 실패 점검' 에서 경고로 뜬다.
          python scripts/run_weekly.py --merge-pool --no-open --allow-partial

      - name: 부분 실패 점검 (소스 일부 실패 여부)
        id: partial
        shell: bash
        run: |
          STATUS=data/logs/run_status.json
          if [ ! -f "$STATUS" ]; then
            echo "::warning::run_status.json 없음 — 부분 실패 판별 생략"
            echo "FAILED_STEPS=" >> $GITHUB_ENV
            exit 0
          fi
          FAILED=$(python scripts/ci_status_summary.py --field steps)
          echo "FAILED_STEPS=$FAILED" >> $GITHUB_ENV
          if [ -n "$FAILED" ]; then
            echo "::warning::수집 단계 일부 실패 — $FAILED (리포트는 생성됨, 해당 섹션 누락 가능)"
            {
              echo "### ⚠️ 부분 실패"
              echo ""
              echo "다음 단계가 실패했습니다 (리포트는 나머지 소스로 생성·발송됨):"
              echo ""
              echo "- $FAILED" | sed 's| / |\n- |g'
            } >> $GITHUB_STEP_SUMMARY
            # 영업팀 메일 본문에 붙일 안내 배너 (부분 실패일 때만)
            echo "PARTIAL_NOTE=<div style=\"background:#fff8e6;padding:12px 16px;border-left:4px solid #d4a017;border-radius:4px;margin:14px 0;font-size:.92em\">⚠️ 이번 주는 일부 데이터 소스 수집이 실패했습니다 (<b>$FAILED</b>). 해당 섹션이 비어 있거나 적을 수 있습니다.</div>" >> $GITHUB_ENV
          else
            echo "모든 수집 단계 정상"
            echo "PARTIAL_NOTE=" >> $GITHUB_ENV
          fi

      - name: Locate + verify report (품질 검증)
        id: verify
        shell: bash
        run: |
          REPORT=$(ls -t data/daily_report_*.html 2>/dev/null | head -1)
          if [ -z "$REPORT" ]; then
            echo "::error::리포트 파일을 못 찾음 (data/daily_report_*.html)"
            exit 1
          fi
          SIZE=$(stat -c%s "$REPORT" 2>/dev/null || wc -c < "$REPORT")
          echo "리포트 경로: $REPORT"
          echo "크기: $SIZE bytes"

          # 최소 크기 검증 (placeholder 가 아니라 진짜 리포트)
          if [ "$SIZE" -lt 20000 ]; then
            echo "::error::리포트가 너무 작음(${SIZE}B). 정상 크기는 100KB+ 이상"
            exit 1
          fi

          # 핵심 섹션 포함 여부
          for kw in "나라장터" "DART" "식약처" "뉴스"; do
            if ! grep -q "$kw" "$REPORT"; then
              echo "::warning::리포트에 '$kw' 섹션이 안 보임"
            fi
          done

          # docs/ 로 복사 (Pages 갱신)
          mkdir -p docs/archive
          cp "$REPORT" docs/index.html
          echo "→ docs/index.html 갱신 (${SIZE}B)"

          # docs/archive/YYYY-MM-DD.html 로도 영구 보존 (일자별 아카이브)
          KST_FILENAME=$(TZ=Asia/Seoul date +'%Y-%m-%d')
          cp "$REPORT" "docs/archive/$KST_FILENAME.html"
          echo "→ docs/archive/$KST_FILENAME.html 보존"

          # 아카이브 인덱스 페이지 자동 생성 (최신순 정렬)
          {
            echo '<!DOCTYPE html>'
            echo '<html lang="ko"><head><meta charset="utf-8">'
            echo '<meta name="robots" content="noindex,nofollow,noarchive">'
            echo '<title>수주레이더 — 아카이브</title>'
            echo '<style>body{font-family:-apple-system,"맑은 고딕",sans-serif;max-width:600px;margin:40px auto;padding:0 20px;line-height:1.7}h1{color:#0969da}ul{list-style:none;padding:0}li{padding:8px 0;border-bottom:1px solid #eee}a{color:#0969da;text-decoration:none;font-size:1.05em}a:hover{text-decoration:underline}.back{margin-top:30px;font-size:.9em;color:#666}</style>'
            echo '</head><body>'
            echo '<h1>📂 일자별 리포트 아카이브</h1>'
            echo '<ul>'
            for f in $(ls -1 docs/archive/*.html 2>/dev/null | grep -v '/index.html$' | sort -r); do
              bn=$(basename "$f" .html)
              echo "  <li><a href=\"$bn.html\">📅 $bn</a></li>"
            done
            echo '</ul>'
            echo '<p class="back"><a href="../">← 최신 리포트로</a></p>'
            echo '</body></html>'
          } > docs/archive/index.html
          echo "→ docs/archive/index.html (아카이브 목록) 갱신"

          # 다음 step 용으로 환경변수 export
          echo "REPORT_PATH=$REPORT" >> $GITHUB_ENV
          echo "REPORT_SIZE=$SIZE"   >> $GITHUB_ENV
          echo "KST_DATE=$(TZ=Asia/Seoul date +'%Y-%m-%d %a')" >> $GITHUB_ENV
          echo "KST_FILENAME=$KST_FILENAME" >> $GITHUB_ENV

      - name: 첨부용 HTML 파일 준비 (날짜 포함 파일명)
        shell: bash
        run: |
          # docs/index.html 을 더 식별 가능한 이름으로 복사하여 첨부
          ATT_NAME="수주레이더_$(TZ=Asia/Seoul date +'%Y-%m-%d').html"
          cp docs/index.html "data/$ATT_NAME"
          echo "ATT_PATH=data/$ATT_NAME" >> $GITHUB_ENV
          echo "  첨부 파일: $ATT_NAME ($(stat -c%s "data/$ATT_NAME") bytes)"

      - name: 발송 직전 중복 확인 (지연된 앞 슬롯이 이미 보냈는지)
        id: presend
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_weekly_guard.py --mode guard

      - name: Send email — 짧은 안내 + 첨부파일 (본문 인라인 X)
        # 정기 스케줄(금 07:00)은 항상 영업팀 발송.
        # 수동 재실행(workflow_dispatch)은 기본적으로 docs/Pages 갱신만 하고 메일은 안 보냄
        # (보고서 수정본 재발행 시 중복메일 방지). 단, 발사 실패한 주차를 되살릴 때는
        # Run workflow 에서 send_email 을 체크하면 그 회차도 영업팀에 발송된다.
        if: (github.event_name == 'schedule' || inputs.send_email) && steps.presend.outputs.skip != 'true'
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "[수주레이더] ${{ env.KST_DATE }} 주간 리포트"
          to: abcde@xicna.com, phm0802@xicna.com, yhchoi777@xicna.com, ykkim@xicna.com, hhssea21@xicna.com, leeyuseob@xicna.com
          from: 수주레이더 봇 <${{ secrets.SMTP_USER }}>
          html_body: |
            <div style="font-family:-apple-system,'맑은 고딕','Malgun Gothic',sans-serif;max-width:560px;padding:20px;color:#222;line-height:1.6">
              <h2 style="color:#0969da;margin-top:0">📊 수주레이더 ${{ env.KST_DATE }}</h2>
              <p>이번 주 수주레이더 리포트가 도착했습니다.</p>
              ${{ env.PARTIAL_NOTE }}
              <div style="background:#f0f7ff;padding:14px 18px;border-left:4px solid #0969da;border-radius:4px;margin:18px 0">
                📎 <b>첨부된 HTML 파일을 클릭</b>하여 브라우저에서 열어보세요.<br>
                <span style="color:#555;font-size:.9em">메일 본문 인라인 렌더링은 일부 깨지므로, <b>첨부파일이 정식 버전</b>입니다. 더블클릭하면 즐겨찾기·필터·기간선택 등 모든 인터랙티브 기능이 작동합니다.</span>
              </div>
              <p style="margin-bottom:6px"><b>또는 웹으로 보기 (북마크 추천):</b></p>
              <ul style="padding-left:20px">
                <li><a href="https://hong-seok-young.github.io/xicna-sujoo-radar/" style="color:#0969da">📊 최신 리포트 (항상 최신 발사분)</a></li>
                <li><a href="https://hong-seok-young.github.io/xicna-sujoo-radar/archive/${{ env.KST_FILENAME }}.html" style="color:#0969da">📅 오늘 영구 링크 (${{ env.KST_FILENAME }})</a></li>
                <li><a href="https://hong-seok-young.github.io/xicna-sujoo-radar/archive/" style="color:#0969da">📂 전체 일자별 아카이브</a></li>
              </ul>
              <hr style="border:none;border-top:1px solid #e0e0e0;margin:24px 0">
              <p style="color:#888;font-size:.85em;margin:0">자동 발송 · 매주 금요일 07:00 KST · 자이씨앤에이 영업팀 · GitHub Actions</p>
            </div>
          attachments: ${{ env.ATT_PATH }}

      - name: Commit & push docs + archive (Pages 갱신)
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/archive/
          if git diff --staged --quiet; then
            echo "변경 없음 — commit 생략"
            exit 0
          fi
          git commit -m "auto: daily report ${{ env.KST_FILENAME }} (latest + archive)"
          # 워크플로 도는 중 origin 이 앞서갔을 수 있음 → rebase 후 푸시 (최대 3회 재시도)
          # --autostash: 파이프라인이 수정한 다른 tracked file(예: config/industrial_dongs.csv)
          #              때문에 rebase 가 막히지 않도록 자동 stash
          for i in 1 2 3; do
            if git push; then
              echo "  ✓ push 성공"
              exit 0
            fi
            echo "  ! push 실패 ($i/3) — pull --rebase --autostash 후 재시도"
            git pull --rebase --autostash origin main || true
          done
          echo "::error::push 3회 재시도 후 실패"
          exit 1

      # ──────────────────────────────────────────────────────────
      # 부분 실패(리포트는 나갔지만 소스 일부 실패) — 운영자에게만 경고
      # 영업팀 발송은 정상 진행됨. 같은 소스가 2주 연속 실패하면 키·API 점검 필요.
      # ──────────────────────────────────────────────────────────
      - name: ⚠️ 부분 실패 경고 메일 (운영자 전용)
        if: success() && env.FAILED_STEPS != ''
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "⚠️ [수주레이더] 부분 실패 — 리포트는 발송됨 (${{ env.KST_DATE }})"
          to: abcde@xicna.com
          from: 수주레이더 알림 <${{ secrets.SMTP_USER }}>
          html_body: |
            <div style="font-family:-apple-system,'맑은 고딕',sans-serif;max-width:560px;padding:20px;color:#222;line-height:1.6">
              <h2 style="color:#d4a017;margin-top:0">⚠️ 수주레이더 부분 실패</h2>
              <p>영업팀 리포트는 <b>정상 발송</b>됐습니다. 다만 아래 수집 단계가 실패해
                 해당 섹션이 비었거나 적을 수 있습니다.</p>
              <div style="background:#fff8e6;padding:14px 18px;border-left:4px solid #d4a017;border-radius:4px;margin:18px 0">
                <b>실패 단계</b>: ${{ env.FAILED_STEPS }}<br>
                <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" style="color:#0969da">run 로그 보기</a>
              </div>
              <p style="color:#555;margin-bottom:6px">한 주만 그러면 대개 외부 API 일시장애입니다.
                 <b>2주 연속 같은 단계</b>가 실패하면 키 만료(OpenDART / 공공데이터포털)를 확인하세요.</p>
              <hr style="border:none;border-top:1px solid #e0e0e0;margin:24px 0">
              <p style="color:#888;font-size:.85em;margin:0">자동 발송 · run #${{ github.run_number }} · ${{ github.event_name }} 트리거</p>
            </div>

      # ──────────────────────────────────────────────────────────
      # 안전망: 위 step 중 하나라도 실패하면 운영자(abcde@xicna.com)에게만 알림
      # 영업팀(REPORT_RECIPIENTS) 에는 보내지 않음 — 그들은 조치 불가
      # ──────────────────────────────────────────────────────────
      - name: 실패 진단 수집 (로그 꼬리 → 메일 본문)
        if: failure()
        shell: bash
        run: |
          # 운영자가 GitHub 로그를 못 볼 상황(모바일·비로그인)에서도 메일만으로 1차 진단이
          # 되도록, 실패한 단계의 출력 꼬리(traceback)를 메일 본문에 실어 보낸다.
          # 1순위: run_status.json 의 failed_tails (실패한 자식 프로세스의 마지막 40줄)
          # 2순위: run_weekly 로그 파일 꼬리 (단계명·소요시간)
          if [ -f data/logs/run_status.json ]; then
            echo "FAILED_STEPS=$(python scripts/ci_status_summary.py --field steps)" >> $GITHUB_ENV
            TAIL=$(python scripts/ci_status_summary.py --field tails)
          else
            echo "run_status.json 없음 — 파이프라인이 요약 단계 전에 죽었을 가능성"
            TAIL=$(tail -n 40 data/logs/run_*.log 2>/dev/null || echo "(로그 파일 없음)")
          fi
          # 메일 본문이 HTML 이라 <pre> 안에 넣기 전에 이스케이프
          TAIL=$(printf '%s' "$TAIL" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          {
            echo 'LOG_TAIL<<__EOF__'
            echo "$TAIL"
            echo '__EOF__'
          } >> $GITHUB_ENV

      - name: 실패 로그 업로드 (아티팩트)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: run-logs-${{ github.run_number }}
          path: |
            data/logs/
          retention-days: 14
          if-no-files-found: warn

      - name: 🚨 실패 알림 메일 (운영자 전용)
        if: failure()
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "🚨 [수주레이더] 발사 실패 — 점검 필요 (${{ env.KST_DATE || 'date 미설정' }})"
          to: abcde@xicna.com
          from: 수주레이더 알림 <${{ secrets.SMTP_USER }}>
          html_body: |
            <div style="font-family:-apple-system,'맑은 고딕',sans-serif;max-width:560px;padding:20px;color:#222;line-height:1.6">
              <h2 style="color:#d73a49;margin-top:0">🚨 수주레이더 발사 실패</h2>
              <p>오늘 발사된 워크플로 중 하나 이상의 step 이 실패했습니다.<br>
                 영업팀(REPORT_RECIPIENTS) 에는 이 메일이 가지 않으니, 점검 후 수동 재발사해 주세요.</p>
              <div style="background:#fff5f5;padding:14px 18px;border-left:4px solid #d73a49;border-radius:4px;margin:18px 0">
                <b>실패 단계</b>: ${{ env.FAILED_STEPS || '(요약 전에 중단 — 아래 로그 참고)' }}<br><br>
                <b>실패한 run 로그 보기</b>:<br>
                <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" style="color:#0969da">
                  https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
                </a>
              </div>
              <p style="margin-bottom:6px"><b>실행 로그 마지막 40줄</b>:</p>
              <pre style="background:#f6f8fa;padding:12px;border-radius:4px;font-size:.78em;line-height:1.45;overflow-x:auto;white-space:pre-wrap">${{ env.LOG_TAIL }}</pre>
              <p style="margin-bottom:6px"><b>흔한 원인 (체크리스트)</b>:</p>
              <ul style="padding-left:20px;color:#555">
                <li>OpenDART / 공공데이터포털 API 키 만료</li>
                <li>Gmail App Password 만료 (16자리)</li>
                <li>액션 버전 deprecation (Node 20 → 24 등)</li>
                <li>코드 push 후 도입된 버그</li>
                <li>GitHub Actions 자체 장애 (status.github.com 확인)</li>
              </ul>
              <p style="margin-bottom:6px"><b>수동 재발사</b>:</p>
              <p style="padding-left:20px">
                <a href="https://github.com/${{ github.repository }}/actions/workflows/weekly-report.yml" style="color:#0969da">
                  Actions 탭 → Run workflow 버튼
                </a><br>
                <span style="color:#555;font-size:.9em">이번 주 리포트를 영업팀에도 보내려면
                <b>send_email 체크</b> 후 실행하세요 (미체크 시 웹페이지만 갱신).</span>
              </p>
              <hr style="border:none;border-top:1px solid #e0e0e0;margin:24px 0">
              <p style="color:#888;font-size:.85em;margin:0">자동 발송 · run #${{ github.run_number }} · ${{ github.event_name }} 트리거</p>
            </div>
