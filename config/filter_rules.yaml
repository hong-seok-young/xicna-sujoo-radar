# 룰 필터 규칙 — 자이씨앤에이(Xi C&A) 수주레이더용
# 회사 도메인: 첨단 산업시설 시공 (CR/일반생산/제약바이오/식품/화장품/R&D/이차전지)
# 지역: 한국(전국) + 베트남/폴란드/인도/중국/미국
# 제외: 주택, 관급공사, 공급인프라, 의료기관, 학교, 일반 노이즈
#
# Stage 1에서 사용. 정규식 패턴 매칭.
# 재현율(놓치지 않기) 우선 설계 — 그래도 명백한 노이즈는 강하게 잘라낸다.

