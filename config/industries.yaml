# 산업군 분류 정의
# Stage 2 LLM 프롬프트에서 사용.

industries:
  - code: "SEMI_CR"
    name: "반도체CR"
    description: "반도체 FAB·클린룸·패키징·전후공정·웨이퍼 공장 + 반도체·디스플레이 소부장(소재·부품·장비) 생산시설"
    keywords: ["반도체", "FAB", "팹", "클린룸", "패키징", "후공정", "전공정", "EUV", "웨이퍼", "OSAT", "테스트베드",
               "소부장", "반도체장비", "반도체소재", "반도체부품", "디스플레이장비", "증착장비", "노광장비", "식각장비", "특수가스", "산업가스"]

  - code: "GENERAL"
    name: "일반생산"
    description: "일반 제조 공장, 스마트팩토리, 물류센터, 산업단지, 첨단 산업시설(첨단산업단지·국가산단·소부장특화단지)"
    keywords: ["공장신축", "생산공장", "스마트팩토리", "물류창고", "물류센터", "산업단지", "공장증설", "제조시설",
               "첨단산업", "첨단제조", "첨단산업단지", "국가산단", "소부장특화단지", "산업시설", "생산시설"]

  - code: "DATACENTER"
    name: "데이터센터"
    description: "데이터센터·IDC·하이퍼스케일 — 첨단 산업시설(클린전원·냉각·전산실 시공 영역)"
    keywords: ["데이터센터", "IDC", "하이퍼스케일", "클라우드데이터센터", "AI데이터센터", "코로케이션", "전산센터"]

  - code: "GMP_BIO"
    name: "GMP제약바이오"
    description: "제약·바이오 GMP 공장, CDMO, 백신, 세포배양, 원료의약품"
    keywords: ["제약", "바이오", "GMP", "CGMP", "BGMP", "바이오플랜트", "백신공장", "세포배양", "원료의약품", "CDMO", "CMO"]

  - code: "FOOD"
    name: "식품음료"
    description: "식품·음료 공장, HACCP, 냉장물류, 콜드체인"
    keywords: ["식품공장", "HACCP", "냉장물류", "콜드체인", "식품제조", "음료공장", "가공시설"]

  - code: "COSMETIC"
    name: "화장품"
    description: "화장품 OEM/ODM 공장, CGMP 인증 시설"
    keywords: ["화장품공장", "OEM", "ODM", "CGMP", "뷰티"]

  - code: "RND"
    name: "연구시설R&D"
    description: "R&D센터, 연구소, 기술원, 실증센터"
    keywords: ["R&D센터", "연구소", "기술연구원", "실증센터", "혁신센터", "파일럿플랜트"]

  - code: "BATTERY"
    name: "이차전지"
    description: "배터리 셀·양극재·음극재 공장, 기가팩토리, ESS"
    keywords: ["기가팩토리", "배터리셀", "양극재", "음극재", "분리막", "전해질", "ESS", "전구체"]

  - code: "EXCLUDE"
    name: "제외대상"
    description: "주택·오피스텔, 관급공사, 공공 인프라 (도로·교량·항만 등)"
    keywords: ["아파트", "오피스텔", "주상복합", "재건축", "재개발", "관급", "도로공사", "교량", "항만", "지하철"]

# 영업팀 요구사항 (필터 기준)
business_filters:
  min_amount_billion_krw: 450    # 최소 450억 원 (하한은 유지)
  max_amount_trillion_krw: null  # 상한 없음 (2026-06-04 영업팀 요청으로 제거 — 큰 프로젝트일수록 큰 기회). null=무제한
  regions_include:
    - "대한민국"
    - "베트남"
    - "폴란드"
    - "인도"
    - "중국"
    - "미국"
  client_revenue_min_billion_krw: 1000  # 발주처 매출액 1,000억 이상
  client_investment_min_billion_krw: 450
