name: Weekly report (자동발송)

on:
  schedule:
    # 본 운영: 매일 07:00 KST = 22:00 UTC (전날)
    # GitHub schedule 5~30분 지연 감안하면 실제 도착 07:05~07:30 KST
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Restore data/cache (EAIS, DART body, MFDS prev-snapshot)
        uses: actions/cache@v4
        with:
          path: data/cache
          key: data-cache-${{ github.run_number }}
          restore-keys: |
            data-cache-

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install python-dotenv

      - name: Run weekly pipeline (수집 + 필터 + HTML 리포트)
        shell: bash
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          G2B_API_KEY:      ${{ secrets.DATA_GO_KR_KEY }}
          EAIS_API_KEY:     ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          mkdir -p data/raw data/filtered data/cache data/logs
          # EAIS 포함 풀파이프라인. 첫 sweep 은 ~22분(900 API), 이후 캐시로 빠름
          python scripts/run_weekly.py --no-open

      - name: Locate + verify report (품질 검증)
        id: verify
        shell: bash
        run: |
          REPORT=$(ls -t data/daily_report_*.html 2>/dev/null | head -1)
          if [ -z "$REPORT" ]; then
            echo "::error::리포트 파일을 못 찾음 (data/daily_report_*.html)"
            exit 1
          fi
          SIZE=$(stat -c%s "$REPORT" 2>/dev/null || wc -c < "$REPORT")
          echo "리포트 경로: $REPORT"
          echo "크기: $SIZE bytes"

          # 최소 크기 검증 (placeholder 가 아니라 진짜 리포트)
          if [ "$SIZE" -lt 20000 ]; then
            echo "::error::리포트가 너무 작음(${SIZE}B). 정상 크기는 100KB+ 이상"
            exit 1
          fi

          # 핵심 섹션 포함 여부
          for kw in "나라장터" "DART" "식약처" "뉴스"; do
            if ! grep -q "$kw" "$REPORT"; then
              echo "::warning::리포트에 '$kw' 섹션이 안 보임"
            fi
          done

          # docs/ 로 복사 (Pages 갱신)
          mkdir -p docs/archive
          cp "$REPORT" docs/index.html
          echo "→ docs/index.html 갱신 (${SIZE}B)"

          # docs/archive/YYYY-MM-DD.html 로도 영구 보존 (주차별 아카이브)
          KST_FILENAME=$(TZ=Asia/Seoul date +'%Y-%m-%d')
          cp "$REPORT" "docs/archive/$KST_FILENAME.html"
          echo "→ docs/archive/$KST_FILENAME.html 보존"

          # 아카이브 인덱스 페이지 자동 생성 (최신순 정렬)
          {
            echo '<!DOCTYPE html>'
            echo '<html lang="ko"><head><meta charset="utf-8">'
            echo '<meta name="robots" content="noindex,nofollow,noarchive">'
            echo '<title>수주레이더 — 아카이브</title>'
            echo '<style>body{font-family:-apple-system,"맑은 고딕",sans-serif;max-width:600px;margin:40px auto;padding:0 20px;line-height:1.7}h1{color:#0969da}ul{list-style:none;padding:0}li{padding:8px 0;border-bottom:1px solid #eee}a{color:#0969da;text-decoration:none;font-size:1.05em}a:hover{text-decoration:underline}.back{margin-top:30px;font-size:.9em;color:#666}</style>'
            echo '</head><body>'
            echo '<h1>📂 주차별 리포트 아카이브</h1>'
            echo '<ul>'
            for f in $(ls -1 docs/archive/*.html 2>/dev/null | grep -v '/index.html$' | sort -r); do
              bn=$(basename "$f" .html)
              echo "  <li><a href=\"$bn.html\">📅 $bn</a></li>"
            done
            echo '</ul>'
            echo '<p class="back"><a href="../">← 최신 리포트로</a></p>'
            echo '</body></html>'
          } > docs/archive/index.html
          echo "→ docs/archive/index.html (아카이브 목록) 갱신"

          # 다음 step 용으로 환경변수 export
          echo "REPORT_PATH=$REPORT" >> $GITHUB_ENV
          echo "REPORT_SIZE=$SIZE"   >> $GITHUB_ENV
          echo "KST_DATE=$(TZ=Asia/Seoul date +'%Y-%m-%d %a')" >> $GITHUB_ENV
          echo "KST_FILENAME=$KST_FILENAME" >> $GITHUB_ENV

      - name: 첨부용 HTML 파일 준비 (날짜 포함 파일명)
        shell: bash
        run: |
          # docs/index.html 을 더 식별 가능한 이름으로 복사하여 첨부
          ATT_NAME="수주레이더_$(TZ=Asia/Seoul date +'%Y-%m-%d').html"
          cp docs/index.html "data/$ATT_NAME"
          echo "ATT_PATH=data/$ATT_NAME" >> $GITHUB_ENV
          echo "  첨부 파일: $ATT_NAME ($(stat -c%s "data/$ATT_NAME") bytes)"

      - name: Send email — 짧은 안내 + 첨부파일 (본문 인라인 X)
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "[수주레이더] ${{ env.KST_DATE }} 주간 리포트"
          to: ${{ secrets.REPORT_RECIPIENTS }}
          from: 수주레이더 봇 <${{ secrets.SMTP_USER }}>
          html_body: |
            <div style="font-family:-apple-system,'맑은 고딕','Malgun Gothic',sans-serif;max-width:560px;padding:20px;color:#222;line-height:1.6">
              <h2 style="color:#0969da;margin-top:0">📊 수주레이더 ${{ env.KST_DATE }}</h2>
              <p>이번 주 수주레이더 리포트가 도착했습니다.</p>
              <div style="background:#f0f7ff;padding:14px 18px;border-left:4px solid #0969da;border-radius:4px;margin:18px 0">
                📎 <b>첨부된 HTML 파일을 클릭</b>하여 브라우저에서 열어보세요.<br>
                <span style="color:#555;font-size:.9em">메일 본문 인라인 렌더링은 일부 깨지므로, <b>첨부파일이 정식 버전</b>입니다. 더블클릭하면 즐겨찾기·필터·기간선택 등 모든 인터랙티브 기능이 작동합니다.</span>
              </div>
              <p style="margin-bottom:6px"><b>또는 웹으로 보기 (북마크 추천):</b></p>
              <ul style="padding-left:20px">
                <li><a href="https://hong-seok-young.github.io/xicna-sujoo-radar/" style="color:#0969da">📊 최신 리포트 (항상 이번 주)</a></li>
                <li><a href="https://hong-seok-young.github.io/xicna-sujoo-radar/archive/${{ env.KST_FILENAME }}.html" style="color:#0969da">📅 이번 주 영구 링크 (${{ env.KST_FILENAME }})</a></li>
                <li><a href="https://hong-seok-young.github.io/xicna-sujoo-radar/archive/" style="color:#0969da">📂 전체 주차 아카이브</a></li>
              </ul>
              <hr style="border:none;border-top:1px solid #e0e0e0;margin:24px 0">
              <p style="color:#888;font-size:.85em;margin:0">자동 발송 · 매주 금요일 08:30 KST · 자이씨앤에이 영업팀 · GitHub Actions</p>
            </div>
          attachments: ${{ env.ATT_PATH }}

      - name: Commit & push docs + archive (Pages 갱신)
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/archive/
          if git diff --staged --quiet; then
            echo "변경 없음 — commit 생략"
            exit 0
          fi
          git commit -m "auto: weekly report ${{ env.KST_FILENAME }} (latest + archive)"
          # 워크플로 도는 중 origin 이 앞서갔을 수 있음 → rebase 후 푸시 (최대 3회 재시도)
          # --autostash: 파이프라인이 수정한 다른 tracked file(예: config/industrial_dongs.csv)
          #              때문에 rebase 가 막히지 않도록 자동 stash
          for i in 1 2 3; do
            if git push; then
              echo "  ✓ push 성공"
              exit 0
            fi
            echo "  ! push 실패 ($i/3) — pull --rebase --autostash 후 재시도"
            git pull --rebase --autostash origin main || true
          done
          echo "::error::push 3회 재시도 후 실패"
          exit 1

      # ──────────────────────────────────────────────────────────
      # 안전망: 위 step 중 하나라도 실패하면 운영자(abcde@xicna.com)에게만 알림
      # 영업팀(REPORT_RECIPIENTS) 에는 보내지 않음 — 그들은 조치 불가
      # ──────────────────────────────────────────────────────────
      - name: 🚨 실패 알림 메일 (운영자 전용)
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "🚨 [수주레이더] 발사 실패 — 점검 필요 (${{ env.KST_DATE || 'date 미설정' }})"
          to: abcde@xicna.com
          from: 수주레이더 알림 <${{ secrets.SMTP_USER }}>
          html_body: |
            <div style="font-family:-apple-system,'맑은 고딕',sans-serif;max-width:560px;padding:20px;color:#222;line-height:1.6">
              <h2 style="color:#d73a49;margin-top:0">🚨 수주레이더 발사 실패</h2>
              <p>오늘 발사된 워크플로 중 하나 이상의 step 이 실패했습니다.<br>
                 영업팀(REPORT_RECIPIENTS) 에는 이 메일이 가지 않으니, 점검 후 수동 재발사해 주세요.</p>
              <div style="background:#fff5f5;padding:14px 18px;border-left:4px solid #d73a49;border-radius:4px;margin:18px 0">
                <b>실패한 run 로그 보기</b>:<br>
                <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" style="color:#0969da">
                  https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
                </a>
              </div>
              <p style="margin-bottom:6px"><b>흔한 원인 (체크리스트)</b>:</p>
              <ul style="padding-left:20px;color:#555">
                <li>OpenDART / 공공데이터포털 API 키 만료</li>
                <li>Gmail App Password 만료 (16자리)</li>
                <li>액션 버전 deprecation (Node 20 → 24 등)</li>
                <li>코드 push 후 도입된 버그</li>
                <li>GitHub Actions 자체 장애 (status.github.com 확인)</li>
              </ul>
              <p style="margin-bottom:6px"><b>수동 재발사</b>:</p>
              <p style="padding-left:20px">
                <a href="https://github.com/${{ github.repository }}/actions/workflows/weekly-report.yml" style="color:#0969da">
                  Actions 탭 → Run workflow 버튼
                </a>
              </p>
              <hr style="border:none;border-top:1px solid #e0e0e0;margin:24px 0">
              <p style="color:#888;font-size:.85em;margin:0">자동 발송 · run #${{ github.run_number }} · ${{ github.event_name }} 트리거</p>
            </div>
