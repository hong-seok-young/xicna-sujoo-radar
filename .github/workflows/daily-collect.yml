name: 일일 수집 (RSS 누적)

# RSS 피드는 최신 N건만 보관 → 주 1회만 긁으면 기사 많은 매체의 초반(월·화) 기사가
# 금요일엔 피드에서 밀려나 누락된다. 매일 수집해 GitHub Actions 캐시(data/pool)에 쌓고,
# 금요일 weekly-report 가 7일치를 병합(중복제거)해 사용한다.
#   - 기사 본문을 repo(git)에 커밋하지 않음 → 캐시로 누적 (매일 접근하므로 7일 idle 만료도 없음)
#   - DART·나라장터·식약처는 날짜범위 API라 롤오프가 없어 여기서 수집하지 않음 (금요일 일괄)

on:
  schedule:
    # 매일 06:00 KST (전일 21:00 UTC). GitHub schedule 5~30분 지연 감안.
    - cron: '0 21 * * *'
    # 금 11:00 KST — '주간 발송 누락 감시' 전용 슬롯. weekly 마지막 자동 시도(금 09:40)가
    # 지연을 감안해도 끝난 시각이라, 여기서 미발송이면 진짜 누락 → 금요일 오전 중에 알린다.
    # (RSS 수집도 같이 한 번 더 도는데 멱등이라 무해하고 풀도 최신화된다)
    - cron: '0 2 * * 5'
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # 주간 발송 누락 감시(ci_weekly_guard)가 weekly run 이력을 조회

# 풀(캐시) 동시 쓰기 방지 — weekly-report 와 같은 그룹으로 직렬화 (서로 안 겹치게)
concurrency:
  group: rss-pool
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Restore/seed RSS pool cache (data/pool)
        uses: actions/cache@v6
        with:
          path: data/pool
          # run_number 로 매번 새 키 → 항상 저장. restore-keys 로 직전 풀 복원.
          key: rss-pool-${{ github.run_number }}
          restore-keys: |
            rss-pool-

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install python-dotenv

      - name: Collect RSS + filter → pool
        shell: bash
        run: |
          mkdir -p data/raw data/filtered data/pool data/logs
          # RSS 만 수집 (공개 피드 — 외부 키 불필요). --days 2 (하루 겹침, 실행 한 번 건너뛰어도 구멍 X).
          python scripts/run_collect.py --days 2 --keep-days 10

      - name: 풀 상태 출력
        if: always()
        shell: bash
        run: |
          echo "현재 RSS 풀 (data/pool):"
          ls -la data/pool/ 2>/dev/null || echo "  (아직 비어 있음 — 첫 실행)"
          echo "보관 일수: $(ls -1 data/pool/rss_*.jsonl 2>/dev/null | wc -l)일치"

      # ──────────────────────────────────────────────────────────
      # 주간 발송 누락 감시 — 예약(schedule) 이벤트가 통째로 드롭돼 run 조차
      # 안 생기는 경우(2026-08-28 실제 발생)는 '실패 알림'으로 못 잡는다.
      # 매일 도는 이 워크플로가 '가장 최근 지나간 금요일에 발송이 있었나' 를 확인한다.
      # ──────────────────────────────────────────────────────────
      - name: 주간 발송 누락 감시
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_weekly_guard.py --mode watchdog

      - name: 📭 주간 리포트 미발송 알림 (운영자 전용)
        if: always() && env.WEEKLY_MISSING == '1'
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "📭 [수주레이더] ${{ env.WEEKLY_MISSING_DATE }} 주간 리포트가 발송되지 않았습니다"
          to: abcde@xicna.com
          from: 수주레이더 알림 <${{ secrets.SMTP_USER }}>
          html_body: |
            <div style="font-family:-apple-system,'맑은 고딕',sans-serif;max-width:560px;padding:20px;color:#222;line-height:1.6">
              <h2 style="color:#d73a49;margin-top:0">📭 주간 리포트 미발송</h2>
              <p><b>${{ env.WEEKLY_MISSING_DATE }}</b> (금) 영업팀 발송 기록이 없습니다.
                 실패한 run 이 있는 게 아니라 <b>예약 자체가 안 떠서 run 이 생성되지 않은</b>
                 경우일 수 있습니다 (GitHub 이 고부하 시 schedule 이벤트를 드롭함).</p>
              <div style="background:#fff5f5;padding:14px 18px;border-left:4px solid #d73a49;border-radius:4px;margin:18px 0">
                <b>조치</b>: 아래에서 <b>Run workflow → send_email 체크</b> 후 실행<br>
                <a href="https://github.com/${{ github.repository }}/actions/workflows/weekly-report.yml" style="color:#0969da">
                  주간 리포트 워크플로 열기
                </a>
              </div>
              <p style="color:#555;font-size:.92em">주간 워크플로에는 백업 예약 슬롯이 2개
                 더 있습니다(금 07:40 · 10:40 KST). 그 세 개가 모두 드롭됐다는 뜻이라
                 GitHub Actions 상태를 함께 확인해 주세요:
                 <a href="https://www.githubstatus.com/" style="color:#0969da">githubstatus.com</a></p>
              <hr style="border:none;border-top:1px solid #e0e0e0;margin:24px 0">
              <p style="color:#888;font-size:.85em;margin:0">자동 발송 · 일일 수집 워크플로의 주간 발송 감시 스텝</p>
            </div>

      # ──────────────────────────────────────────────────────────
      # 안전망: 실패 시 운영자(abcde@xicna.com)에게만 알림 (영업팀엔 안 보냄)
      # ──────────────────────────────────────────────────────────
      - name: 🚨 실패 알림 메일 (운영자 전용)
        if: failure()
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "🚨 [수주레이더] 일일 수집 실패 — 풀 누적 점검 필요"
          to: abcde@xicna.com
          from: 수주레이더 알림 <${{ secrets.SMTP_USER }}>
          html_body: |
            <div style="font-family:-apple-system,'맑은 고딕',sans-serif;max-width:560px;padding:20px;color:#222;line-height:1.6">
              <h2 style="color:#d73a49;margin-top:0">🚨 일일 RSS 수집 실패</h2>
              <p>오늘 일일 수집(RSS → 풀 누적)이 실패했습니다. 하루 누락돼도 금요일 리포트는
                 나머지 날짜로 동작하지만, 연속 실패 시 주간 누락이 커집니다.</p>
              <div style="background:#fff5f5;padding:14px 18px;border-left:4px solid #d73a49;border-radius:4px;margin:18px 0">
                <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" style="color:#0969da">실패 run 로그 보기</a>
              </div>
              <p style="color:#888;font-size:.85em;margin:0">자동 발송 · run #${{ github.run_number }} · 일일 수집 워크플로</p>
            </div>
