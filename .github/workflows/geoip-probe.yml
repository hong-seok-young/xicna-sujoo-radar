name: GeoIP probe (한국 API 도달성)

# 목적: GitHub Actions 의 미국(또는 글로벌) runner IP 에서
#       한국 정부/언론 API 가 도달 가능한지 측정.
#       결과를 geoip_result.md 로 커밋 → raw.githubusercontent 로 외부 확인 가능.

on:
  push:
    paths:
      - '.github/workflows/geoip-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Probe Korean endpoints
        shell: bash
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          DATA_GO_KR_KEY:   ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          set -uo pipefail
          out=geoip_result.md

          KEY_MODE="dummy"
          if [ -n "${OPENDART_API_KEY:-}" ] && [ -n "${DATA_GO_KR_KEY:-}" ]; then
            KEY_MODE="real"
          fi

          {
            echo "# GeoIP Probe Report"
            echo ""
            echo "**GitHub Actions runner → 한국 정부 API / RSS 도달성 측정**"
            echo ""
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| Runner public IP | \`$(curl -s --max-time 10 ifconfig.me || echo unknown)\` |"
            echo "| Runner country (ipinfo) | \`$(curl -s --max-time 10 ipinfo.io/country || echo unknown)\` |"
            echo "| Runner OS | \`$RUNNER_OS / $RUNNER_ARCH\` |"
            echo "| 실행 시각 (UTC) | \`$(date -u +'%Y-%m-%d %H:%M:%S')\` |"
            echo "| **API 키 모드** | **\`${KEY_MODE}\`** (real = secrets 사용 / dummy = TEST) |"
            echo ""
            echo "---"
            echo ""
            echo "## 1. 한국 정부 API"
            echo ""
            if [ "$KEY_MODE" = "real" ]; then
              echo "> **실제 키 사용** — HTTP 200 + 본문에 데이터 키가 보이면 ✅ 정상."
            else
              echo "> **dummy key 사용** — \`SERVICE_KEY\` / \`status\` / \`errMsg\` 등 구조화된 에러 응답이 오면 API 자체는 도달함."
            fi
            echo ""
          } > "$out"

          probe_gov() {
            local name="$1" url="$2"
            local code body verdict
            code=$(curl -sL -o /tmp/body.txt -w "%{http_code}" --max-time 30 --max-redirs 3 "$url" 2>/tmp/err.txt || echo "ERR")
            local err
            err=$(cat /tmp/err.txt 2>/dev/null || true)
            body=$(head -c 400 /tmp/body.txt 2>/dev/null | tr '\r\n' '  ' || echo "")

            if [ "$code" = "ERR" ] || [ -z "$code" ]; then
              verdict="❌ **연결 실패** (curl error: $err)"
            elif [ "$code" = "000" ]; then
              verdict="❌ **TIMEOUT / 연결 끊김**"
            elif echo "$body" | grep -qiE 'SERVICE_KEY|errMsg|resultCode|"status"|<status>|<code>|<cmmMsgHeader>'; then
              verdict="✅ **도달 OK** (구조화된 API 에러 응답 수신)"
            elif [ "$code" = "200" ]; then
              verdict="🟡 HTTP 200 — 구조 패턴 미감지, 본문 확인 필요"
            elif [ "$code" = "403" ]; then
              verdict="⚠️ HTTP 403 — geo-WAF 차단 가능성 (또는 인증)"
            elif [ "$code" = "401" ]; then
              verdict="🟡 HTTP 401 — 인증 거부 (도달은 한 듯)"
            else
              verdict="🟡 HTTP \`$code\` — 본문 확인"
            fi

            {
              echo "### $name"
              echo ""
              echo "- **판정**: $verdict"
              echo "- HTTP: \`$code\`"
              echo "- URL: \`$url\`"
              echo "- 응답 앞 400B:"
              echo ""
              echo '```'
              echo "$body"
              echo '```'
              echo ""
            } >> "$out"
          }

          DART_KEY="${OPENDART_API_KEY:-TEST}"
          DGK_KEY="${DATA_GO_KR_KEY:-TEST}"

          probe_gov "DART (opendart.fss.or.kr)" \
            "https://opendart.fss.or.kr/api/list.json?crtfc_key=${DART_KEY}&bgn_de=20260521&end_de=20260528&page_count=1"

          probe_gov "EAIS / 세움터 건축HUB (apis.data.go.kr/1613000)" \
            "https://apis.data.go.kr/1613000/ArchPmsHubService/getApBasisOulnInfo?serviceKey=${DGK_KEY}&sigunguCd=11000&bjdongCd=10300&numOfRows=1&_type=json"

          probe_gov "MFDS / 식약처 GMP (apis.data.go.kr/1471000)" \
            "https://apis.data.go.kr/1471000/DrugGmpStbltJgmtIssuStusService/getDrugGmpStbltJgmtIssuStusInq?serviceKey=${DGK_KEY}&numOfRows=1&pageNo=1&type=json"

          probe_gov "나라장터 G2B (apis.data.go.kr/1230000)" \
            "http://apis.data.go.kr/1230000/ad/BidPublicInfoService/getBidPblancListInfoCnstwk?serviceKey=${DGK_KEY}&pageNo=1&numOfRows=1&inqryDiv=1&type=json"

          {
            echo "---"
            echo ""
            echo "## 2. 주요 RSS 피드 도달성 (실제 키 없이 GET)"
            echo ""
          } >> "$out"

          probe_rss() {
            local name="$1" url="$2"
            local code size
            code=$(curl -sL -o /tmp/body.txt -w "%{http_code}" --max-time 20 --max-redirs 3 "$url" 2>/dev/null || echo "ERR")
            size=$(wc -c < /tmp/body.txt 2>/dev/null | tr -d ' ' || echo 0)
            local mark
            if [ "$code" = "200" ] && [ "$size" -gt 200 ] 2>/dev/null; then
              mark="✅"
            elif [ "$code" = "ERR" ] || [ "$code" = "000" ]; then
              mark="❌"
            else
              mark="🟡"
            fi
            echo "| $mark | $name | \`$code\` | ${size}B | \`$url\` |" >> "$out"
          }

          {
            echo "| 결과 | 매체 | HTTP | 본문크기 | URL |"
            echo "|---|---|---|---|---|"
          } >> "$out"

          probe_rss "연합뉴스(경제)"      "https://www.yna.co.kr/rss/economy.xml"
          probe_rss "한국경제(경제)"      "https://www.hankyung.com/feed/economy"
          probe_rss "조선일보(경제)"      "https://www.chosun.com/arc/outboundfeeds/rss/category/economy/?outputType=xml"
          probe_rss "뉴시스(산업)"        "https://www.newsis.com/RSS/industry.xml"
          probe_rss "히트뉴스(제약)"      "https://www.hitnews.co.kr/rss/allArticle.xml"
          probe_rss "디일렉(반도체)"      "https://www.thelec.kr/rss/allArticle.xml"
          probe_rss "팜뉴스"              "https://www.pharmnews.com/rss/allArticle.xml"
          probe_rss "비즈워치"            "https://news.bizwatch.co.kr/rss/all"

          {
            echo ""
            echo "---"
            echo ""
            echo "## 3. 종합 판정 가이드"
            echo ""
            echo "- **정부 API 4개 모두 ✅** + **RSS 다수 ✅** → GitHub Actions 에서 운영 가능, 본 배포 진행"
            echo "- **정부 API 일부 ❌/⚠️** → 해당 소스에 대해 한국 클라우드 VM 경유 또는 프록시 검토"
            echo "- **RSS 대부분 ❌** → GitHub 미국 IP 가 한국 언론에서 차단된 것 → 한국 클라우드로 전면 피벗"
            echo ""
            echo "_자동 생성: \`.github/workflows/geoip-probe.yml\`_"
          } >> "$out"

          echo ""
          echo "=========================================="
          echo "결과 파일 미리보기 (앞 80줄):"
          echo "=========================================="
          head -80 "$out"

      - name: Commit result back
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add geoip_result.md
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore: geoip probe result [skip ci]"
            git push
          fi
